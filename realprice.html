<script>
"use strict";
const rows = JSON.parse(document.getElementById("data").textContent);
const $ = id => document.getElementById(id);
const types = ["매매", "전세", "월세"];
const colors = ["#176b55", "#3569a4", "#aa5418"];
const latest = Math.max(...rows.map(row => row.month));
const earliest = Math.min(...rows.map(row => row.month));
const format = new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 1 });
const number = value => format.format(value);
const monthText = month => Math.floor(month / 100) + "년 " + month % 100 + "월";
const median = values => {
  if (!values.length) return null;
  const sorted = [...values].sort((a, b) => a - b);
  const middle = Math.floor(sorted.length / 2);
  return sorted.length % 2 ? sorted[middle] : (sorted[middle - 1] + sorted[middle]) / 2;
};
function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}
function options(id, values) {
  for (const value of values) $(id).add(new Option(value, value));
}
options("year", [...new Set(rows.map(row => Math.floor(row.month / 100)))].sort((a,b) => b-a));
options("trade", types);
options("building", [...new Set(rows.map(row => row.building))].sort());
$("coverage").textContent = rows[0].region + " · " + monthText(earliest) + "–" + monthText(latest) + " · 원자료 " + number(rows.length) + "건";
for (const [index, type] of types.entries()) {
  const label = element("span");
  const dot = element("i", undefined, "dot");
  dot.style.backgroundColor = colors[index];
  label.append(dot, type);
  $("legend").append(label);
  $("price-legend").append(label.cloneNode(true));
}
function selected(row) {
  const query = $("query").value.trim().replace(/\s+/g, "");
  return (!$("trade").value || row.trade === $("trade").value)
    && (!$("building").value || row.building === $("building").value)
    && (row.address + row.name).replace(/\s+/g, "").includes(query);
}
function table(target, data, limit = data.length) {
  target.replaceChildren();
  if (!data.length) {
    target.append(element("p", "조건에 해당하는 거래가 없습니다.", "muted"));
    return;
  }
  const table = element("table");
  const heading = table.createTHead().insertRow();
  for (const text of ["계약월","단지·구분","주소","유형","건물","가격·보증금 (만원)","월세 (만원)","층","건축연도"]) {
    const th = element("th", text);
    th.scope = "col";
    heading.append(th);
  }
  const body = table.createTBody();
  for (const row of data.slice(0, limit)) {
    const tr = body.insertRow();
    for (const value of [monthText(row.month),row.name,row.address,row.trade,row.building,number(row.price),row.trade === "월세" ? number(row.rent) : "—",row.floor ?? "—",row.built ?? "—"]) {
      tr.insertCell().textContent = value;
    }
  }
  target.append(table);
}
function chart(id, months, buckets, isPrice) {
  const namespace = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(namespace, "svg");
  svg.setAttribute("viewBox", "0 0 620 238");
  svg.setAttribute("class", "chart");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", isPrice ? "월별 계약금액 중앙값" : "월별 거래 건수");
  function draw(tag, attrs, label) {
    const node = document.createElementNS(namespace, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    if (label !== undefined) node.textContent = label;
    svg.append(node);
    return node;
  }
  const peak = Math.max(0, ...buckets.flatMap(values => isPrice ? values : [values.reduce((a,b) => a+b,0)]));
  const step = Math.max(1, Math.ceil(peak / 4 / (isPrice ? 1000 : 1)) * (isPrice ? 1000 : 1));
  const dx = 545 / months.length;
  const x = index => 60 + dx * (index + .5);
  const y = value => 200 - 175 * value / (step * 4);
  for (let i = 0; i <= 4; i++) {
    draw("line", {x1:60,x2:605,y1:y(i*step),y2:y(i*step),stroke:"#dce8e1"});
    draw("text", {x:54,y:y(i*step)+4,"text-anchor":"end","font-size":12,fill:"#456055"}, number(i*step));
  }
  for (const [i, month] of months.entries()) {
    if (i % Math.ceil(months.length / 8) === 0 || (i === months.length - 1 && i % Math.ceil(months.length / 8) > 1)) {
      draw("text",{x:x(i),y:224,"text-anchor":"middle","font-size":12,fill:"#456055"},String(month).slice(2,4)+"."+String(month).slice(4));
    }
    let accumulated = 0;
    for (const [j, value] of buckets[i].entries()) {
      if (isPrice && value !== null) {
        const prior = buckets[i-1]?.[j];
        if (prior != null) draw("line",{x1:x(i-1),x2:x(i),y1:y(prior),y2:y(value),stroke:colors[j],"stroke-width":2});
        const marker = draw("circle",{cx:x(i),cy:y(value),r:3.5,fill:colors[j]});
        hover(marker, month, j, value);
      } else if (!isPrice && value > 0) {
        const bar = draw("rect",{x:x(i)-dx*.34,y:y(accumulated+value),width:dx*.68,height:y(accumulated)-y(accumulated+value),fill:colors[j]});
        hover(bar, month, j, value);
        accumulated += value;
      }
    }
  }
  function hover(node, month, index, value) {
    const title = document.createElementNS(namespace,"title");
    title.textContent = monthText(month)+" "+types[index]+" "+number(value)+(isPrice ? "만원" : "건");
    node.append(title);
  }
  $(id).replaceChildren(svg);
  if (!peak) $(id).append(element("p","표시할 거래가 없습니다.","muted"));
}
const recent = rows.filter(row => row.month === latest && Number.isFinite(row.lat) && Number.isFinite(row.lon));
const map = $("map");
const zoom = 15;
const world = 256 * 2 ** zoom;
function project(lat, lon) {
  const rad = lat * Math.PI / 180;
  return [(lon + 180) / 360 * world, (1 - Math.asinh(Math.tan(rad)) / Math.PI) / 2 * world];
}
const coords = recent.map(row => project(row.lat,row.lon));
const center = [0,1].map(axis => (Math.min(...coords.map(point => point[axis])) + Math.max(...coords.map(point => point[axis]))) / 2);
function drawMap() {
  const width = map.clientWidth, height = map.clientHeight;
  const left = center[0] - width/2, top = center[1] - height/2;
  map.replaceChildren();
  for (let x = Math.floor(left/256); x <= Math.floor((left+width)/256); x++) {
    for (let y = Math.floor(top/256); y <= Math.floor((top+height)/256); y++) {
      const tile = element("img");
      tile.alt = "";
      tile.style.left = (x*256-left)+"px";
      tile.style.top = (y*256-top)+"px";
      tile.addEventListener("error",()=>tile.remove(),{once:true});
      tile.src = "https://tile.openstreetmap.org/"+zoom+"/"+x+"/"+y+".png";
      map.append(tile);
    }
  }
  const credit = element("a","© OpenStreetMap 기여자","credit");
  credit.href = "https://www.openstreetmap.org/copyright";
  map.append(credit);
  const visible = recent.filter(selected);
  const groups = new Map();
  for (const row of visible) {
    const key = row.lat.toFixed(5) + "," + row.lon.toFixed(5);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  }
  $("map-note").textContent = monthText(latest)+" 고정 · "+visible.length+"건 · "+groups.size+"개 위치. 연도 필터와 별도로 표시합니다.";
  table($("map-records"),visible);
  $("map-selection").textContent = visible.length ? "번호를 누르면 해당 위치의 거래를 볼 수 있습니다." : "현재 조건에서 지도에 표시할 거래가 없습니다.";
  for (const group of groups.values()) {
    const [x,y] = project(group[0].lat,group[0].lon);
    const pin = element("button",group.length,"pin");
    pin.style.left = (x-left)+"px";
    pin.style.top = (y-top)+"px";
    pin.setAttribute("aria-label",group[0].name+" "+group.length+"건");
    pin.setAttribute("aria-pressed","false");
    pin.addEventListener("click",()=>{
      const active = pin.getAttribute("aria-pressed")==="true";
      for (const other of map.querySelectorAll("button")) other.setAttribute("aria-pressed","false");
      if (!active) pin.setAttribute("aria-pressed","true");
      $("map-selection").textContent = active ? "최근 월 전체 위치" : group[0].name+" · "+group.length+"건";
      table($("map-records"),active ? visible : group);
    });
    map.append(pin);
  }
}
function render() {
  const year = Number($("year").value);
  const data = rows.filter(row => selected(row) && (!year || Math.floor(row.month / 100) === year));

  const metrics = [
    ["거래 건수",data.length,"건"],

    ["전세보증금 중앙값",median(byTrade[1].map(row=>row.price)),"만원"],

  $("metrics").replaceChildren(...metrics.map(([label,value,unit])=>{

  }));
  const months = [];
  for (let m = year ? Math.max(earliest,year*100+1) : earliest; m <= (year ? Math.min(latest,year*100+12) : latest); m += m%100===12 ? 89 : 1) months.push(m);
  const byMonth = months.map(month => byTrade.map(list=>list.filter(row=>row.month===month)));
  chart("volume",months,byMonth.map(bucket=>bucket.map(list=>list.length)),false);
  chart("prices",months,byMonth.map(bucket=>bucket.map(list=>median(list.map(row=>row.price)))),true);
  $("row-count").textContent = "총 "+number(data.length)+"건 · 최신 월부터 표시";
  table($("records"),[...data].sort((a,b)=>b.month-a.month));
  drawMap();
}
for (const id of ["year","trade","building","query"]) $(id).addEventListener("input",render);
render();
new ResizeObserver(drawMap).observe(map);
</script>
</body>
